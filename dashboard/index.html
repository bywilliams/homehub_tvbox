<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        HomeHub Dashboard
    </title>


    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <link 
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body class="bg-light">


<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <span class="navbar-brand mb-0 h1">
            🏠 HomeHub Gateway
        </span>

    </div>

</nav>


<div class="container mt-3">

    <div id="alerts"></div>

</div>



<div class="container mt-4">


    <div class="row">


        <div class="col-md-6">

            <div class="card shadow-sm">

                <div class="card-header">
                    Sistema
                </div>


                <div class="card-body">

                    <p>
                        <strong>Dispositivo:</strong>
                        <span id="device">
                            -
                        </span>
                    </p>


                    <p>
                        <strong>Hardware:</strong>
                        <span id="hardware">
                            -
                        </span>
                    </p>


                    <p>
                        <strong>Versão:</strong>
                        <span id="version">
                            -
                        </span>
                    </p>


                    <p>
                        <strong>Modo:</strong>
                        <span id="mode">
                            -
                        </span>
                    </p>


                </div>

            </div>


        </div>




        <div class="col-md-6">


            <div class="card shadow-sm">


                <div class="card-header">
                    Serviços
                </div>


                <div class="card-body">


                    <ul class="list-group">


                        <li class="list-group-item">
                            MQTT:
                            <span id="mqtt">
                                -
                            </span>
                        </li>


                        <li class="list-group-item">
                            Storage:
                            <span id="storage">
                                -
                            </span>
                        </li>


                        <li class="list-group-item">
                            Files:
                            <span id="files">
                                -
                            </span>
                        </li>


                        <li class="list-group-item">
                            Doctor:
                            <span id="doctor">
                                -
                            </span>
                        </li>


                    </ul>


                </div>


            </div>


        </div>


    </div>





    <div class="row mt-4">


        <div class="col">


            <div class="card shadow-sm">


                <div class="card-header">

                    Armazenamento

                </div>


                <div class="card-body">


                    <p>
                        <strong>Tipo:</strong>
                        <span id="storage_type">
                            -
                        </span>
                    </p>


                    <p>
                        <strong>Capacidade:</strong>
                        <span id="storage_capacity">
                            -
                        </span>
                    </p>


                    <p>
                        <strong>Caminho:</strong>
                        <span id="storage_path">
                            -
                        </span>
                    </p>


                </div>


            </div>


        </div>

        <div class="row mt-4">
        
            <div class="col">
        
                <div class="card shadow-sm">
        
                    <div class="card-header">
                        Arquivos
                    </div>
        
                    <div class="card-body">

                    	<div class="mb-3 d-flex gap-2">
                    	
                    	    <input
                    	        type="file"
                    	        id="file_upload"
                    	        class="form-control"
                    	    >
                    	
                    	    <button
                    	        id="upload_button"
                    	        class="btn btn-success"
                    	    >
                    	        ⬆ Upload
                    	    </button>
                    	
                    	</div>
        
                        <ul
                            id="file_list"
                            class="list-group"
                        >
        
                            <li class="list-group-item">
                                Carregando...
                            </li>
        
                        </ul>
        
                    </div>
        
                </div>
        
            </div>

            <div class="text-end text-muted mt-3">
            
                Última atualização:
                <span id="last_update">-</span>
            
            </div>
        
        </div>


    </div>



</div>


<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/components.js"></script>
<script src="js/files.js"></script>
<script src="js/dashboard.js"></script>
</body>

</html>
